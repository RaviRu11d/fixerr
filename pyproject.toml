[project]
name = "fixerr"
version = "0.2.0"
description = "Local-first, provider-agnostic error/fix memory with a semantic search TUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ucmani" }]
keywords = ["cli", "tui", "error-tracking", "developer-tools", "embeddings", "ollama", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.24",
    "textual>=0.60",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/RaviRu11d/fixerr"
Repository = "https://github.com/RaviRu11d/fixerr"
Issues = "https://github.com/RaviRu11d/fixerr/issues"
Changelog = "https://github.com/RaviRu11d/fixerr/blob/master/CHANGELOG.md"

[project.optional-dependencies]
ollama = []                           # no extra dep, uses httpx directly
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.20.0"]
gemini = ["google-generativeai>=0.5.0"]
all-providers = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    "google-generativeai>=0.5.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
fixerr = "fixerr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fixerr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
# E501: line length is advisory; B008: function-call defaults are the Typer idiom.
ignore = ["E501", "B008"]
